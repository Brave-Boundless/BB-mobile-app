# Smoke flow from CLAUDE.md §4: onboard → complete Day 1 → see Progress.
# Run against a dev build:  maestro test .maestro/smoke.yaml
appId: com.braveandboundless.app
---
- clearState
- launchApp
- assertVisible: "15 rules. 3 drills each. 45 days."
- tapOn:
    id: "start-day-1"
- tapOn:
    id: "notify-deny"
- assertVisible: "Drill 1 of 45 · Rule 1 · Drill 1 of 3"
- assertVisible: "Move Before You’re Ready"
- tapOn: "Did it. Log today’s drill as done."
- assertVisible: "Done."
- assertVisible: "Action beats anxiety."
- tapOn:
    id: "evening-input"
- inputText: "It cost me my excuse."
- tapOn:
    id: "evening-save"
- assertVisible: "In the journal."
- tapOn: "Rules"
- tapOn:
    id: "segment-progress"
- assertVisible: "1 of 45 drills answered"
